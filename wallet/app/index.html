<html>
    <style>
    .container {
        display: grid;
        grid-template-areas:
        "header header"
        "menu content"
        "footer footer";
            border-radius: 10px 10px 0px 0px;

        grid-template-columns: 1fr 2fr;
        gap: 3px;
        background-color: purple;
        padding: 5px;
    }
    .container div {
        background-color: white;
        padding: 10px;
    }
    .container div.header {
        grid-area: header;
        text-align: center;
        font-size: 20px;
        background-color: purple;
        color: white;
    }
    .container div.menu {
        grid-area: menu;
    }
    .container div.content {
        grid-area: content;
    }
    .container div.footer {
        grid-area: footer;
        text-align: center; 
        color: grey; 
    }
    button {
        padding: 9px;
        background: black;
        color: white;
        border: none;
        border-radius: 10px;
        margin: 6px;
    }
    button:hover {
        padding: 9px;
        background: #bff;
        color: black;
        cursor: pointer;
        border: none;
        border-radius: 10px;
    }
    a:hover{
        color: lightblue
    }
    </style>
    <body>
        <div class="container">
          <div class="header"><h2>$100</h2><button>send money</button><button>subscriptions</button></br></br></div>
          <div class="menu"><a href="#">Account Transfers</a><br><br/><a href="#">Bill Payments</a><br><br/><a href="#">Interac e-transfer</a><br/><br/><a href="#">Sinusodial Credit</a></div>
          <div class="content">Chequing 0473</div>
          <div class="footer"><h4>Need to contact a representative?</h4><p>+1647914XXXX</p></div>
        </div>
    </body>
</html>
